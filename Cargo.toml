[package]
name = "goal-ledger"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A local request ledger and compaction recovery hook for Codex"
publish = false

[dependencies]
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
